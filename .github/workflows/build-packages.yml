name: Build packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Numeric package version (major.minor.patch)
        required: true
        type: string
      publish:
        description: Publish the successful build to GitHub Releases
        default: false
        type: boolean
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  PACKAGE_VERSION: ${{ inputs.version || '0.0.0' }}

jobs:
  linux:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-packages'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Test and package Linux web server
        run: |
          if [[ ! "$PACKAGE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Package version must be major.minor.patch without leading zeros."
            exit 1
          fi
          bash eng/build-linux.sh "$PACKAGE_VERSION" "$GITHUB_SHA"
          bash eng/test-linux-packages.sh artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: artifacts/packages/
          if-no-files-found: error

  windows:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'build-packages'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: ./eng/Install-TestFfmpeg.ps1
      - name: Install Inno Setup
        run: ./eng/Install-InnoSetup.ps1
      - name: Build and test Windows packages
        run: |
          ./eng/Build-Packages.ps1 -Version $env:PACKAGE_VERSION -Commit $env:GITHUB_SHA
          ./eng/Test.ps1 -ServerAssembly artifacts/publish/win-x64/SecurityCameraViewer.Web.dll
          ./eng/Test-WindowsPackage.ps1 -Packages artifacts/packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: artifacts/packages/
          if-no-files-found: error

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency: release-${{ inputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-packages'
          merge-multiple: true
          path: packages
      - name: Verify and publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (
            cd packages
            sha256sum --check -- *.sha256
          )
          tag="v$PACKAGE_VERSION"
          if git ls-remote --exit-code "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag"; then
            echo "Tag $tag already exists. Choose a new version."
            exit 1
          else
            status=$?
            if [[ $status -ne 2 ]]; then
              exit "$status"
            fi
          fi
          gh release create "$tag" packages/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Security Camera Viewer $PACKAGE_VERSION" --generate-notes
